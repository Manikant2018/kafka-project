server:
  port: 8080
  shutdown: graceful

kafka:
  topic:
    name: api-log-topic
    anomaly-alerts: anomaly-alerts-topic # New topic for anomaly alerts

logging:
  retention:
    days: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-}, spanId=%X{spanId:-}] - %msg%n"
  level:
    root: INFO
    com.api.logging: INFO
    org.springframework.kafka: WARN

spring:
  application:
    name: enterprise-logging-service
  
  lifecycle:
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      pool:
        size: 5

  datasource:
    url: jdbc:postgresql://localhost:5432/logging_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      enable.idempotence: true
      compression.type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: logging-group # For LogConsumerService
      anomaly-group-id: anomaly-detector-group # New group for AnomalyDetectionService
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

anomaly:
  detection:
    threshold:
      execution-time-ms: 500 # Example: Flag if API takes longer than 500ms
  remediation:
    suggestions:
      HIGH_LATENCY: "Investigate resource contention (CPU/Memory) or database performance. Check external dependencies."
      SERVER_ERROR: "Review recent deployments. Check application logs for detailed stack traces. Verify database connectivity."
      # Add more specific suggestions here
